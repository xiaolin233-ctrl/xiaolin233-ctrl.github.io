<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势控制3D圣诞树粒子系统</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/EffectComposer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/RenderPass.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/UnrealBloomPass.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/FilmPass.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/GlitchPass.min.js"></script>
    <script src="https://unpkg.com/mediapipe-hands@0.4.1646424915/hands.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #video-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            height: 200px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        
        #video {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 350px;
            border: 2px solid #B22222;
            box-shadow: 0 0 15px rgba(178, 34, 34, 0.5);
        }
        
        h1 {
            color: #D4AF37;
            margin-bottom: 10px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
        }
        
        .subtitle {
            color: #2F4F2F;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .state-indicator {
            background: rgba(47, 79, 47, 0.8);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #D4AF37;
        }
        
        .state-title {
            font-weight: bold;
            color: #D4AF37;
            margin-bottom: 5px;
        }
        
        .state-description {
            font-size: 13px;
            color: #ccc;
        }
        
        .gesture-list {
            margin: 15px 0;
        }
        
        .gesture-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .gesture-icon {
            width: 40px;
            height: 40px;
            background: rgba(178, 34, 34, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 20px;
            color: #D4AF37;
        }
        
        .gesture-text {
            font-size: 14px;
        }
        
        .upload-container {
            margin-top: 20px;
        }
        
        .upload-label {
            display: block;
            background: rgba(47, 79, 47, 0.8);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px dashed #D4AF37;
            transition: all 0.3s;
        }
        
        .upload-label:hover {
            background: rgba(47, 79, 47, 1);
            border-color: #B22222;
        }
        
        #photo-upload {
            display: none;
        }
        
        #photo-count {
            font-size: 12px;
            text-align: center;
            color: #aaa;
        }
        
        .current-state {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            color: #D4AF37;
            border: 2px solid #B22222;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
            transition: all 0.5s;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #D4AF37;
        }
        
        .loading-spinner {
            border: 5px solid rgba(47, 79, 47, 0.3);
            border-top: 5px solid #D4AF37;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .photo-frame {
            position: absolute;
            z-index: 5;
            background: rgba(0, 0, 0, 0.9);
            border: 15px solid #D4AF37;
            border-image: linear-gradient(45deg, #D4AF37, #B22222, #2F4F2F) 1;
            display: none;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.8);
            overflow: hidden;
        }
        
        .photo-content {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .close-photo {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #B22222;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 6;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="video-container">
            <video id="video" playsinline></video>
        </div>
        
        <div id="ui">
            <h1>手势控制3D圣诞树</h1>
            <div class="subtitle">结合Three.js与MediaPipe Hands的交互式粒子系统</div>
            
            <div class="state-indicator">
                <div class="state-title">系统状态</div>
                <div class="state-description" id="state-text">初始化中...</div>
            </div>
            
            <div class="gesture-list">
                <div class="gesture-item">
                    <div class="gesture-icon">✊</div>
                    <div class="gesture-text">握拳 - 回到合拢态（圣诞树形态）</div>
                </div>
                <div class="gesture-item">
                    <div class="gesture-icon">🖐️</div>
                    <div class="gesture-text">张开手掌 - 进入散开态（粒子漂浮）</div>
                </div>
                <div class="gesture-item">
                    <div class="gesture-icon">↻</div>
                    <div class="gesture-text">手部旋转 - 在散开态下旋转视角</div>
                </div>
                <div class="gesture-item">
                    <div class="gesture-icon">🤏</div>
                    <div class="gesture-text">抓取手势 - 放大选中照片</div>
                </div>
            </div>
            
            <div class="upload-container">
                <label for="photo-upload" class="upload-label">
                    📷 上传照片添加到圣诞树
                </label>
                <input type="file" id="photo-upload" accept="image/*" multiple>
                <div id="photo-count">已加载 0 张照片</div>
            </div>
        </div>
        
        <div class="current-state" id="current-state">初始化中...</div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div>加载模型中，请稍候...</div>
        </div>
        
        <div class="photo-frame" id="photo-frame">
            <button class="close-photo" id="close-photo">×</button>
            <img class="photo-content" id="photo-content" src="" alt="放大照片">
        </div>
    </div>

    <script>
        // 主应用程序
        class ChristmasTreeApp {
            constructor() {
                // 系统状态
                this.STATES = {
                    CLOSED: 'closed',      // 合拢态
                    SCATTERED: 'scattered', // 散开态
                    PHOTO_ZOOM: 'photo_zoom' // 照片放大态
                };
                
                this.currentState = this.STATES.CLOSED;
                this.previousState = null;
                this.photos = [];
                this.photoTextures = [];
                this.photoMeshes = [];
                this.selectedPhoto = null;
                
                // 手势检测参数
                this.lastHandPosition = { x: 0, y: 0, z: 0 };
                this.lastHandRotation = 0;
                this.gestureHistory = [];
                this.gestureHistoryMax = 10;
                
                // 相机控制参数
                this.cameraAngle = { x: 0, y: 0 };
                this.targetCameraAngle = { x: 0, y: 0 };
                
                // 动画参数
                this.transitionProgress = 1.0;
                this.transitionDuration = 1.5;
                
                // 初始化
                this.initThreeJS();
                this.initMediaPipe();
                this.initEventListeners();
                this.createChristmasTree();
                this.animate();
                
                // 更新UI
                this.updateStateUI();
            }
            
            // 初始化Three.js
            initThreeJS() {
                // 场景
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x000000, 10, 50);
                
                // 相机
                this.camera = new THREE.PerspectiveCamera(
                    60, window.innerWidth / window.innerHeight, 0.1, 1000
                );
                this.camera.position.set(0, 5, 15);
                
                // 渲染器
                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true 
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                // 添加到DOM
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);
                
                // 后期处理
                this.composer = new THREE.EffectComposer(this.renderer);
                const renderPass = new THREE.RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);
                
                // 辉光效果
                const bloomPass = new THREE.UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    1.5, 0.4, 0.85
                );
                bloomPass.threshold = 0.2;
                bloomPass.strength = 1.2;
                bloomPass.radius = 0.8;
                this.composer.addPass(bloomPass);
                
                // 电影感效果
                const filmPass = new THREE.FilmPass(0.35, 0.025, 648, false);
                this.composer.addPass(filmPass);
                
                // 灯光
                this.createLights();
                
                // 窗口大小调整
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            // 创建灯光
            createLights() {
                // 环境光
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                
                // 主光源（金色）
                const mainLight = new THREE.DirectionalLight(0xD4AF37, 1.5);
                mainLight.position.set(5, 10, 7);
                mainLight.castShadow = true;
                mainLight.shadow.mapSize.width = 2048;
                mainLight.shadow.mapSize.height = 2048;
                this.scene.add(mainLight);
                
                // 红色补光
                const redLight = new THREE.PointLight(0xB22222, 1.2, 30);
                redLight.position.set(-5, 3, -5);
                this.scene.add(redLight);
                
                // 绿色补光
                const greenLight = new THREE.PointLight(0x2F4F2F, 0.8, 30);
                greenLight.position.set(5, 2, -5);
                this.scene.add(greenLight);
                
                // 辉光点光源
                const glowLight = new THREE.PointLight(0xD4AF37, 2, 20);
                glowLight.position.set(0, 8, 0);
                this.scene.add(glowLight);
            }
            
            // 创建圣诞树元素
            createChristmasTree() {
                // 清空现有元素
                this.treeElements = [];
                this.photoMeshes = [];
                
                // 创建圣诞树圆锥体结构
                const treeHeight = 12;
                const treeRadius = 4;
                const layerCount = 8;
                
                // 颜色定义
                const matteGreen = new THREE.Color(0x2F4F2F);
                const metallicGold = new THREE.Color(0xD4AF37);
                const christmasRed = new THREE.Color(0xB22222);
                
                for (let layer = 0; layer < layerCount; layer++) {
                    const layerHeight = treeHeight * (layer / layerCount);
                    const layerRadius = treeRadius * (1 - layer / layerCount);
                    const elementsInLayer = Math.max(3, Math.floor(8 * (layer / layerCount + 0.5)));
                    
                    for (let i = 0; i < elementsInLayer; i++) {
                        const angle = (i / elementsInLayer) * Math.PI * 2;
                        const radius = layerRadius * (0.7 + Math.random() * 0.3);
                        
                        // 随机选择元素类型
                        const elementType = Math.floor(Math.random() * 4);
                        let element;
                        
                        switch (elementType) {
                            case 0: // 球体
                                element = this.createSphere(
                                    radius * Math.cos(angle),
                                    layerHeight - treeHeight/2,
                                    radius * Math.sin(angle),
                                    metallicGold
                                );
                                break;
                            case 1: // 立方体
                                element = this.createCube(
                                    radius * Math.cos(angle),
                                    layerHeight - treeHeight/2,
                                    radius * Math.sin(angle),
                                    christmasRed
                                );
                                break;
                            case 2: // 糖果棍
                                element = this.createCandyStick(
                                    radius * Math.cos(angle),
                                    layerHeight - treeHeight/2,
                                    radius * Math.sin(angle)
                                );
                                break;
                            case 3: // 照片云
                                element = this.createPhotoCloud(
                                    radius * Math.cos(angle),
                                    layerHeight - treeHeight/2,
                                    radius * Math.sin(angle)
                                );
                                break;
                        }
                        
                        // 保存初始位置（合拢态位置）
                        element.userData.closedPosition = new THREE.Vector3(
                            radius * Math.cos(angle),
                            layerHeight - treeHeight/2,
                            radius * Math.sin(angle)
                        );
                        
                        // 生成随机散开位置
                        element.userData.scatteredPosition = new THREE.Vector3(
                            (Math.random() - 0.5) * 20,
                            (Math.random() - 0.5) * 10,
                            (Math.random() - 0.5) * 20
                        );
                        
                        // 随机旋转和缩放
                        element.userData.rotationSpeed = {
                            x: (Math.random() - 0.5) * 0.02,
                            y: (Math.random() - 0.5) * 0.02,
                            z: (Math.random() - 0.5) * 0.02
                        };
                        
                        element.userData.scale = 0.8 + Math.random() * 0.4;
                        element.scale.setScalar(element.userData.scale);
                        
                        this.treeElements.push(element);
                        this.scene.add(element);
                    }
                }
                
                // 树顶星形
                const star = this.createStar(0, treeHeight/2, 0);
                star.userData.closedPosition = new THREE.Vector3(0, treeHeight/2, 0);
                star.userData.scatteredPosition = new THREE.Vector3(
                    (Math.random() - 0.5) * 15,
                    5 + Math.random() * 5,
                    (Math.random() - 0.5) * 15
                );
                this.treeElements.push(star);
                this.scene.add(star);
                
                // 添加一些粒子
                this.createParticles();
            }
            
            // 创建球体
            createSphere(x, y, z, color) {
                const geometry = new THREE.SphereGeometry(0.3, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.8,
                    roughness: 0.2,
                    emissive: color,
                    emissiveIntensity: 0.2
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, z);
                sphere.castShadow = true;
                sphere.receiveShadow = true;
                return sphere;
            }
            
            // 创建立方体
            createCube(x, y, z, color) {
                const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.7,
                    roughness: 0.3,
                    emissive: color,
                    emissiveIntensity: 0.1
                });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, y, z);
                cube.castShadow = true;
                cube.receiveShadow = true;
                return cube;
            }
            
            // 创建糖果棍
            createCandyStick(x, y, z) {
                const group = new THREE.Group();
                
                // 棍子
                const stickGeometry = new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8);
                const stickMaterial = new THREE.MeshStandardMaterial({
                    color: 0x8B4513,
                    metalness: 0.3,
                    roughness: 0.7
                });
                const stick = new THREE.Mesh(stickGeometry, stickMaterial);
                stick.position.y = 0.6;
                stick.castShadow = true;
                
                // 糖果顶部
                const candyGeometry = new THREE.SphereGeometry(0.2, 16, 16);
                const candyMaterial = new THREE.MeshStandardMaterial({
                    color: 0xFF69B4,
                    metalness: 0.5,
                    roughness: 0.2,
                    emissive: 0xFF69B4,
                    emissiveIntensity: 0.3
                });
                const candy = new THREE.Mesh(candyGeometry, candyMaterial);
                candy.position.y = 1.3;
                candy.castShadow = true;
                
                group.add(stick);
                group.add(candy);
                group.position.set(x, y, z);
                
                return group;
            }
            
            // 创建照片云
            createPhotoCloud(x, y, z) {
                const group = new THREE.Group();
                
                // 云朵基础
                const cloudGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                const cloudMaterial = new THREE.MeshStandardMaterial({
                    color: 0xFFFFFF,
                    metalness: 0.1,
                    roughness: 0.8,
                    transparent: true,
                    opacity: 0.7
                });
                const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
                cloud.castShadow = true;
                
                // 照片占位符（将被实际照片替换）
                const photoGeometry = new THREE.PlaneGeometry(0.6, 0.8);
                const photoMaterial = new THREE.MeshBasicMaterial({
                    color: 0x333333,
                    side: THREE.DoubleSide
                });
                const photo = new THREE.Mesh(photoGeometry, photoMaterial);
                photo.position.z = 0.3;
                photo.userData.isPhoto = true;
                photo.userData.photoIndex = this.photoMeshes.length;
                
                group.add(cloud);
                group.add(photo);
                group.position.set(x, y, z);
                
                this.photoMeshes.push(photo);
                
                return group;
            }
            
            // 创建星星
            createStar(x, y, z) {
                const starGeometry = new THREE.ConeGeometry(0.5, 1, 5);
                const starMaterial = new THREE.MeshStandardMaterial({
                    color: 0xFFD700,
                    metalness: 0.9,
                    roughness: 0.1,
                    emissive: 0xFFD700,
                    emissiveIntensity: 0.5
                });
                const star = new THREE.Mesh(starGeometry, starMaterial);
                star.position.set(x, y, z);
                star.castShadow = true;
                return star;
            }
            
            // 创建背景粒子
            createParticles() {
                const particleCount = 500;
                const particles = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                
                const color = new THREE.Color();
                
                for (let i = 0; i < particleCount; i++) {
                    // 位置
                    const i3 = i * 3;
                    positions[i3] = (Math.random() - 0.5) * 50;
                    positions[i3 + 1] = (Math.random() - 0.5) * 30;
                    positions[i3 + 2] = (Math.random() - 0.5) * 50;
                    
                    // 颜色
                    const colorChoice = Math.random();
                    if (colorChoice < 0.33) {
                        color.set(0x2F4F2F); // 哑光绿
                    } else if (colorChoice < 0.66) {
                        color.set(0xD4AF37); // 金属金
                    } else {
                        color.set(0xB22222); // 圣诞红
                    }
                    
                    colors[i3] = color.r;
                    colors[i3 + 1] = color.g;
                    colors[i3 + 2] = color.b;
                }
                
                particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const particleMaterial = new THREE.PointsMaterial({
                    size: 0.1,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6
                });
                
                this.particleSystem = new THREE.Points(particles, particleMaterial);
                this.scene.add(this.particleSystem);
            }
            
            // 初始化MediaPipe Hands
            initMediaPipe() {
                const video = document.getElementById('video');
                
                // 获取摄像头访问权限
                navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                }).then(stream => {
                    video.srcObject = stream;
                    
                    // 初始化MediaPipe Hands
                    this.hands = new Hands({
                        locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                        }
                    });
                    
                    this.hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.5,
                        minTrackingConfidence: 0.5
                    });
                    
                    this.hands.onResults(this.onHandResults.bind(this));
                    
                    // 开始发送视频帧给MediaPipe
                    const camera = new Camera(video, {
                        onFrame: async () => {
                            await this.hands.send({ image: video });
                        },
                        width: 640,
                        height: 480
                    });
                    
                    camera.start();
                    
                    // 隐藏加载界面
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                    }, 1500);
                    
                }).catch(err => {
                    console.error('摄像头访问失败:', err);
                    document.getElementById('loading').innerHTML = 
                        '<div style="color: #B22222;">摄像头访问被拒绝，请允许摄像头权限后刷新页面</div>';
                });
            }
            
            // MediaPipe Hands结果处理
            onHandResults(results) {
                if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                    return;
                }
                
                const landmarks = results.multiHandLandmarks[0];
                const handedness = results.multiHandedness[0].label;
                
                // 更新手势历史
                this.updateGestureHistory(landmarks);
                
                // 检测手势并执行相应动作
                this.detectGestures(landmarks, handedness);
            }
            
            // 更新手势历史记录
            updateGestureHistory(landmarks) {
                // 记录手部关键点位置
                const wrist = landmarks[0];
                const middleFingerTip = landmarks[12];
                
                this.gestureHistory.push({
                    time: Date.now(),
                    wrist: { x: wrist.x, y: wrist.y, z: wrist.z },
                    middleFingerTip: { x: middleFingerTip.x, y: middleFingerTip.y, z: middleFingerTip.z }
                });
                
                // 保持历史记录长度
                if (this.gestureHistory.length > this.gestureHistoryMax) {
                    this.gestureHistory.shift();
                }
            }
            
            // 检测手势
            detectGestures(landmarks, handedness) {
                // 获取关键点
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                const wrist = landmarks[0];
                
                // 计算指尖到手腕的距离
                const distanceToWrist = (tip) => {
                    return Math.sqrt(
                        Math.pow(tip.x - wrist.x, 2) + 
                        Math.pow(tip.y - wrist.y, 2) + 
                        Math.pow(tip.z - wrist.z, 2)
                    );
                };
                
                const thumbDistance = distanceToWrist(thumbTip);
                const indexDistance = distanceToWrist(indexTip);
                const middleDistance = distanceToWrist(middleTip);
                const ringDistance = distanceToWrist(ringTip);
                const pinkyDistance = distanceToWrist(pinkyTip);
                
                // 计算平均距离
                const avgDistance = (indexDistance + middleDistance + ringDistance + pinkyDistance) / 4;
                
                // 手势1: 握拳（所有指尖靠近手腕）
                if (thumbDistance < 0.15 && avgDistance < 0.15) {
                    this.transitionToState(this.STATES.CLOSED);
                }
                // 手势2: 张开手掌（所有指尖远离手腕）
                else if (thumbDistance > 0.25 && avgDistance > 0.25) {
                    this.transitionToState(this.STATES.SCATTERED);
                }
                // 手势3: 抓取手势（拇指和食指靠近）
                else {
                    const thumbIndexDistance = Math.sqrt(
                        Math.pow(thumbTip.x - indexTip.x, 2) + 
                        Math.pow(thumbTip.y - indexTip.y, 2) + 
                        Math.pow(thumbTip.z - indexTip.z, 2)
                    );
                    
                    if (thumbIndexDistance < 0.05 && this.currentState === this.STATES.SCATTERED) {
                        this.selectPhotoForZoom();
                    }
                }
                
                // 手势4: 手旋转（在散开态下）
                if (this.currentState === this.STATES.SCATTERED && this.gestureHistory.length >= 3) {
                    const recent = this.gestureHistory[this.gestureHistory.length - 1];
                    const older = this.gestureHistory[0];
                    
                    // 计算手部旋转角度
                    const deltaX = recent.wrist.x - older.wrist.x;
                    const deltaY = recent.wrist.y - older.wrist.y;
                    
                    this.targetCameraAngle.x += deltaX * 5;
                    this.targetCameraAngle.y += deltaY * 3;
                }
            }
            
            // 选择照片进行放大
            selectPhotoForZoom() {
                if (this.photoMeshes.length === 0 || this.currentState === this.STATES.PHOTO_ZOOM) {
                    return;
                }
                
                // 随机选择一张照片
                const photoIndex = Math.floor(Math.random() * this.photoMeshes.length);
                this.selectedPhoto = this.photoMeshes[photoIndex];
                
                // 如果有实际照片，显示它
                if (this.photos[photoIndex]) {
                    this.showPhotoZoom(this.photos[photoIndex]);
                }
                
                this.transitionToState(this.STATES.PHOTO_ZOOM);
            }
            
            // 显示照片放大
            showPhotoZoom(photoUrl) {
                const photoFrame = document.getElementById('photo-frame');
                const photoContent = document.getElementById('photo-content');
                
                photoContent.src = photoUrl;
                photoFrame.style.display = 'block';
                
                // 居中显示
                photoFrame.style.width = '70%';
                photoFrame.style.height = '70%';
                photoFrame.style.left = '15%';
                photoFrame.style.top = '15%';
            }
            
            // 关闭照片放大
            closePhotoZoom() {
                document.getElementById('photo-frame').style.display = 'none';
                this.transitionToState(this.STATES.SCATTERED);
            }
            
            // 状态过渡
            transitionToState(newState) {
                if (this.currentState === newState) return;
                
                this.previousState = this.currentState;
                this.currentState = newState;
                this.transitionProgress = 0;
                
                this.updateStateUI();
            }
            
            // 更新状态UI
            updateStateUI() {
                const stateText = document.getElementById('state-text');
                const currentStateDisplay = document.getElementById('current-state');
                
                let stateDescription = '';
                let displayText = '';
                
                switch (this.currentState) {
                    case this.STATES.CLOSED:
                        stateDescription = '圣诞树合拢态：所有元素聚合为圣诞树圆锥体形状';
                        displayText = '🎄 圣诞树形态';
                        break;
                    case this.STATES.SCATTERED:
                        stateDescription = '散开态：所有元素在空间中无序漂浮、散落';
                        displayText = '✨ 元素散开态';
                        break;
                    case this.STATES.PHOTO_ZOOM:
                        stateDescription = '照片放大态：单张照片被放大显示，其他元素保持散开';
                        displayText = '📸 照片查看模式';
                        break;
                }
                
                stateText.textContent = stateDescription;
                currentStateDisplay.textContent = displayText;
            }
            
            // 初始化事件监听器
            initEventListeners() {
                // 照片上传
                document.getElementById('photo-upload').addEventListener('change', (e) => {
                    const files = e.target.files;
                    const photoCount = document.getElementById('photo-count');
                    
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        if (!file.type.match('image.*')) continue;
                        
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            this.photos.push(event.target.result);
                            photoCount.textContent = `已加载 ${this.photos.length} 张照片`;
                            
                            // 更新照片网格的纹理
                            if (this.photoMeshes.length > 0) {
                                const photoIndex = (this.photos.length - 1) % this.photoMeshes.length;
                                const texture = new THREE.TextureLoader().load(event.target.result);
                                this.photoMeshes[photoIndex].material.map = texture;
                                this.photoMeshes[photoIndex].material.needsUpdate = true;
                            }
                        };
                        reader.readAsDataURL(file);
                    }
                });
                
                // 关闭照片按钮
                document.getElementById('close-photo').addEventListener('click', () => {
                    this.closePhotoZoom();
                });
                
                // 点击照片框外部关闭
                document.getElementById('photo-frame').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('photo-frame')) {
                        this.closePhotoZoom();
                    }
                });
            }
            
            // 窗口大小调整处理
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
            }
            
            // 动画循环
            animate() {
                requestAnimationFrame(() => this.animate());
                
                // 更新过渡动画
                if (this.transitionProgress < 1) {
                    this.transitionProgress += 0.016 / this.transitionDuration; // 60fps
                    if (this.transitionProgress > 1) this.transitionProgress = 1;
                }
                
                // 更新元素位置
                this.updateElementsPosition();
                
                // 更新相机角度
                this.updateCamera();
                
                // 旋转粒子
                if (this.particleSystem) {
                    this.particleSystem.rotation.y += 0.001;
                }
                
                // 渲染场景
                this.composer.render();
            }
            
            // 更新元素位置
            updateElementsPosition() {
                if (!this.treeElements) return;
                
                const t = this.transitionProgress;
                const easeT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // 缓动函数
                
                this.treeElements.forEach(element => {
                    let targetPosition;
                    
                    switch (this.currentState) {
                        case this.STATES.CLOSED:
                            targetPosition = element.userData.closedPosition;
                            break;
                        case this.STATES.SCATTERED:
                        case this.STATES.PHOTO_ZOOM:
                            targetPosition = element.userData.scatteredPosition;
                            break;
                    }
                    
                    // 对于选中的照片，在照片放大态时将其移到相机前方
                    if (this.currentState === this.STATES.PHOTO_ZOOM && 
                        this.selectedPhoto && 
                        element === this.selectedPhoto.parent) {
                        targetPosition = new THREE.Vector3(0, 0, -5);
                    }
                    
                    // 插值位置
                    element.position.lerp(targetPosition, easeT * 0.1);
                    
                    // 旋转元素
                    if (this.currentState !== this.STATES.CLOSED) {
                        element.rotation.x += element.userData.rotationSpeed.x;
                        element.rotation.y += element.userData.rotationSpeed.y;
                        element.rotation.z += element.userData.rotationSpeed.z;
                    }
                    
                    // 轻微浮动效果
                    if (this.currentState !== this.STATES.CLOSED) {
                        const floatOffset = Math.sin(Date.now() * 0.001 + element.position.x) * 0.05;
                        element.position.y += floatOffset;
                    }
                });
            }
            
            // 更新相机
            updateCamera() {
                // 平滑相机角度
                this.cameraAngle.x += (this.targetCameraAngle.x - this.cameraAngle.x) * 0.05;
                this.cameraAngle.y += (this.targetCameraAngle.y - this.cameraAngle.y) * 0.05;
                
                // 根据状态设置相机位置
                let targetCameraPosition;
                let targetLookAt;
                
                switch (this.currentState) {
                    case this.STATES.CLOSED:
                        targetCameraPosition = new THREE.Vector3(
                            15 * Math.sin(this.cameraAngle.x * 0.01),
                            5 + this.cameraAngle.y * 0.5,
                            15 * Math.cos(this.cameraAngle.x * 0.01)
                        );
                        targetLookAt = new THREE.Vector3(0, 0, 0);
                        break;
                        
                    case this.STATES.SCATTERED:
                        targetCameraPosition = new THREE.Vector3(
                            20 * Math.sin(this.cameraAngle.x * 0.01),
                            8 + this.cameraAngle.y * 0.5,
                            20 * Math.cos(this.cameraAngle.x * 0.01)
                        );
                        targetLookAt = new THREE.Vector3(0, 0, 0);
                        break;
                        
                    case this.STATES.PHOTO_ZOOM:
                        targetCameraPosition = new THREE.Vector3(0, 0, 10);
                        targetLookAt = new THREE.Vector3(0, 0, 0);
                        break;
                }
                
                // 平滑移动相机
                this.camera.position.lerp(targetCameraPosition, 0.05);
                this.camera.lookAt(targetLookAt);
            }
        }
        
        // 启动应用
        window.addEventListener('DOMContentLoaded', () => {
            new ChristmasTreeApp();
        });
    </script>
