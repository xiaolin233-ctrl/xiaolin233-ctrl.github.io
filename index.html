<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六爻占卜 - 周易六十四卦</title>
    <style>
        :root {
            --bg: #1a1a1f;
            --panel-bg: #23232a;
            --card-bg: #2a2a33;
            --gold: #c9a96e;
            --gold-light: #e0c88e;
            --gold-dark: #9a7b3e;
            --text: #e8e0d5;
            --text-secondary: #b0a89a;
            --text-muted: #7a7265;
            --border: #3a3530;
            --yang: #e8d5a3;
            --yin: #a0b0c0;
            --accent: #c9a96e;
            --danger: #c0392b;
            --success: #6b9b6b;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', 'KaiTi', '楷体', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(201, 169, 110, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 80%, rgba(201, 169, 110, 0.03) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px 0 40px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 28px 20px 10px;
        }
        .header .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 12px rgba(201, 169, 110, 0.4));
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .header h1 {
            font-size: 2rem;
            letter-spacing: 0.08em;
            color: var(--gold-light);
            font-weight: 700;
            margin: 0;
        }
        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            margin-top: 4px;
        }

        /* Main card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card-title {
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            color: var(--gold);
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .card-title::before,
        .card-title::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 1px;
            background: var(--gold-dark);
            opacity: 0.6;
        }

        /* Yao lines selector */
        .yao-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .yao-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 420px;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            background: transparent;
            border: 1px solid transparent;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .yao-row:hover {
            background: rgba(201, 169, 110, 0.06);
            border-color: rgba(201, 169, 110, 0.2);
        }
        .yao-row:active {
            background: rgba(201, 169, 110, 0.12);
            transform: scale(0.985);
            transition: 0.1s;
        }
        .yao-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            width: 48px;
            text-align: right;
            letter-spacing: 0.04em;
            flex-shrink: 0;
            font-weight: 500;
        }
        .yao-display {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 42px;
            transition: var(--transition);
        }
        .yao-symbol {
            font-size: 1.8rem;
            letter-spacing: 0.1em;
            transition: var(--transition);
            font-weight: bold;
        }
        .yao-symbol.yang {
            color: var(--yang);
            text-shadow: 0 0 8px rgba(232, 213, 163, 0.3);
        }
        .yao-symbol.yin {
            color: var(--yin);
            letter-spacing: 0.05em;
        }
        .yao-indicator {
            width: 36px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: left;
            flex-shrink: 0;
            letter-spacing: 0.04em;
            transition: var(--transition);
        }
        .yao-indicator.active-yang {
            color: var(--yang);
        }
        .yao-indicator.active-yin {
            color: var(--yin);
        }
        .yao-divider {
            width: 60%;
            height: 1px;
            background: var(--border);
            opacity: 0.5;
            margin: 2px auto;
            border: none;
        }

        /* Result section */
        .result-area {
            text-align: center;
            margin-top: 8px;
            padding: 16px 0 0;
            border-top: 1px solid var(--border);
        }
        .gua-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 0.08em;
            margin: 6px 0;
            transition: var(--transition);
        }
        .gua-tags {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .gua-tag {
            font-size: 0.78rem;
            background: rgba(201, 169, 110, 0.1);
            color: var(--gold);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.04em;
            border: 1px solid rgba(201, 169, 110, 0.2);
        }
        .gua-number {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* Hexagram visual */
        .hexagram-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin: 16px 0;
            padding: 14px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-sm);
        }
        .hex-line {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            transition: var(--transition);
        }
        .hex-line .bar {
            height: 5px;
            border-radius: 3px;
            transition: var(--transition);
        }
        .hex-line.yang .bar {
            width: 100px;
            background: var(--yang);
            box-shadow: 0 0 6px rgba(232, 213, 163, 0.3);
        }
        .hex-line.yin .bar-left,
        .hex-line.yin .bar-right {
            width: 40px;
            height: 5px;
            border-radius: 3px;
            background: var(--yin);
            box-shadow: 0 0 4px rgba(160, 176, 192, 0.25);
        }
        .hex-line.yin .gap {
            width: 20px;
        }
        .hex-line-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            width: 36px;
            text-align: right;
            margin-right: 10px;
            flex-shrink: 0;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover {
            border-color: var(--gold-dark);
            background: rgba(201, 169, 110, 0.08);
        }
        .btn:active {
            transform: scale(0.96);
            transition: 0.1s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #b8943e, #9a7b3e);
            color: #1a1a1f;
            border: none;
            font-weight: 600;
            letter-spacing: 0.06em;
            box-shadow: 0 2px 12px rgba(201, 169, 110, 0.25);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #c9a450, #a88540);
            box-shadow: 0 4px 18px rgba(201, 169, 110, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(30%);
        }
        .btn-sm {
            padding: 7px 14px;
            font-size: 0.78rem;
            border-radius: 20px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        /* AI explanation area */
        .explanation-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            margin-top: 14px;
            min-height: 60px;
            font-size: 0.88rem;
            line-height: 1.7;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            transition: var(--transition);
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
        }
        .explanation-box.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-muted);
            font-style: italic;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Settings panel */
        .settings-toggle {
            text-align: center;
            margin-top: 4px;
        }
        .settings-toggle button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            font-family: inherit;
            padding: 6px 14px;
            border-radius: 20px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .settings-toggle button:hover {
            color: var(--gold);
            background: rgba(201, 169, 110, 0.06);
        }
        .settings-panel {
            display: none;
            margin-top: 10px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .settings-panel.open {
            display: block;
        }
        .settings-panel label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 3px;
            letter-spacing: 0.04em;
        }
        .settings-panel input,
        .settings-panel select {
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
            letter-spacing: 0.03em;
        }
        .settings-panel input:focus,
        .settings-panel select:focus {
            outline: none;
            border-color: var(--gold-dark);
            box-shadow: 0 0 0 2px rgba(201, 169, 110, 0.1);
        }
        .settings-panel input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2a33;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: var(--shadow);
            font-family: inherit;
        }
        .toast.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .yao-symbol {
                font-size: 1.4rem;
            }
            .hex-line .bar {
                width: 70px;
            }
            .hex-line.yin .bar-left,
            .hex-line.yin .bar-right {
                width: 28px;
            }
            .hex-line.yin .gap {
                width: 14px;
            }
            .yao-label {
                width: 36px;
                font-size: 0.7rem;
            }
            .yao-indicator {
                width: 28px;
                font-size: 0.7rem;
            }
            .card {
                padding: 16px 12px;
            }
            .btn {
                padding: 9px 16px;
                font-size: 0.8rem;
            }
            .gua-name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="icon">☯</span>
            <h1>六爻占卜</h1>
            <p class="subtitle">周易六十四卦 · 从下往上设爻</p>
        </div>

        <!-- Yao Selector Card -->
        <div class="card" id="selectorCard">
            <div class="card-title">选择六爻（从下往上）</div>
            <div class="yao-selector" id="yaoSelector">
                <!-- 6 yao rows, from bottom (初爻) to top (上爻) -->
            </div>
            <div class="btn-group">
                <button class="btn btn-sm" id="btnRandom" title="随机生成一卦">🎲 随机卦象</button>
                <button class="btn btn-sm" id="btnClear" title="全部重置为阳爻">↺ 重置</button>
                <button class="btn btn-sm" id="btnFlipAll" title="翻转全部爻位">⇄ 全部翻转</button>
            </div>
        </div>

        <!-- Result Card -->
        <div class="card" id="resultCard">
            <div class="card-title">卦象结果</div>
            <div class="hexagram-visual" id="hexagramVisual">
                <!-- Visual hexagram from bottom to top -->
            </div>
            <div class="result-area">
                <div class="gua-number" id="guaNumber"></div>
                <div class="gua-name" id="guaName">—</div>
                <div class="gua-tags" id="guaTags"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="btnExplain" disabled>🔮 AI 解卦</button>
            </div>
            <div class="explanation-box" id="explanationBox">
                <span style="color:var(--text-muted);">点击「AI 解卦」获取详细解释</span>
            </div>
            <!-- Local basic info fallback -->
            <div id="localInfo" style="margin-top:10px;font-size:0.8rem;color:var(--text-muted);text-align:center;letter-spacing:0.03em;"></div>
        </div>

        <!-- Settings -->
        <div class="settings-toggle">
            <button id="btnToggleSettings">⚙️ API 设置</button>
        </div>
        <div class="settings-panel" id="settingsPanel">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="sk-... 或您的API密钥">
            <label for="apiBase">API Base URL</label>
            <input type="text" id="apiBase" placeholder="https://api.openai.com/v1">
            <label for="apiModel">模型名称</label>
            <input type="text" id="apiModel" placeholder="gpt-4o-mini">
            <label for="apiSystemPrompt">System Prompt（自定义AI指令）</label>
            <input type="text" id="apiSystemPrompt" placeholder="默认：简短直接解释卦象，无需开场白">
            <div class="btn-group" style="margin-top:12px;">
                <button class="btn btn-sm" id="btnSaveSettings">💾 保存设置</button>
                <button class="btn btn-sm" id="btnResetSettings">↺ 恢复默认</button>
            </div>
            <p style="font-size:0.7rem;color:var(--text-muted);margin-top:8px;text-align:center;">
                ⚠️ API Key 仅存储在浏览器本地，不会上传到任何第三方服务器
            </p>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ============ 64卦完整数据库 ============
            // 八卦：用0-7表示，三位二进制从下往上(初爻,二爻,三爻)
            // 0=坤(000) 1=艮(001) 2=坎(010) 3=巽(011) 4=震(100) 5=离(101) 6=兑(110) 7=乾(111)

                '1-7': { name: '山天大畜', order: 26, desc: '艮上乾下，大畜之卦。天在山中，厚积薄发。宜蓄养待发。' },
                '1-4': { name: '山雷颐', order: 27, desc: '艮上震下，颐养之卦。山下有雷，养正之道。宜自食其力。' },

                '6-1': { name: '泽山咸', order: 31, desc: '兑上艮下，感应之卦。山上有泽，男女感应。宜以诚相待。' },
                '4-3': { name: '雷风恒', order: 32, desc: '震上巽下，恒久之卦。雷风相与，恒久不变。宜持之以恒。' },
                '7-1': { name: '天山遁', order: 33, desc: '乾上艮下，退避之卦。天下有山，君子退隐。宜适时退避。' },
                '4-7': { name: '雷天大壮', order: 34, desc: '震上乾下，大壮之卦。雷在天上，声势壮大。宜守正防过。' },
                '5-0': { name: '火地晋', order: 35, desc: '离上坤下，晋进之卦。明出地上，光明上进。宜稳步前进。' },
                '0-5': { name: '地火明夷', order: 36, desc: '坤上离下，明夷之卦。明入地中，光明受伤。宜韬光养晦。' },
                '3-5': { name: '风火家人', order: 37, desc: '巽上离下，家人之卦。风自火出，家道兴旺。宜和睦治家。' },
                '5-6': { name: '火泽睽', order: 38, desc: '离上兑下，乖睽之卦。上火下泽，二女同居。宜求同存异。' },
                '2-1': { name: '水山蹇', order: 39, desc: '坎上艮下，蹇难之卦。山上有水，险阻难行。宜反求诸己。' },
                '4-2': { name: '雷水解', order: 40, desc: '震上坎下，解缓之卦。雷雨作而百果草木皆甲坼。宜宽恕化解。' },
                '1-6': { name: '山泽损', order: 41, desc: '艮上兑下，损减之卦。山下有泽，损下益上。宜节制减损。' },
                '3-4': { name: '风雷益', order: 42, desc: '巽上震下，增益之卦。风雷相益，损上益下。宜增益善行。' },
                '6-7': { name: '泽天夬', order: 43, desc: '兑上乾下，决断之卦。泽上于天，决而和。宜果敢决断。' },
                '7-3': { name: '天风姤', order: 44, desc: '乾上巽下，邂逅之卦。天下有风，不期而遇。宜谨慎应对。' },
                '6-0': { name: '泽地萃', order: 45, desc: '兑上坤下，萃聚之卦。泽上于地，万物萃聚。宜聚集人才。' },
                '0-3': { name: '地风升', order: 46, desc: '坤上巽下，上升之卦。地中生木，步步高升。宜循序渐进。' },
                '6-2': { name: '泽水困', order: 47, desc: '兑上坎下，困厄之卦。泽无水，困穷之象。宜坚守正道。' },
                '2-3': { name: '水风井', order: 48, desc: '坎上巽下，井养之卦。木上有水，井养不穷。宜修德养民。' },
                '6-5': { name: '泽火革', order: 49, desc: '兑上离下，变革之卦。泽中有火，二女同居。宜顺天应人。' },
                '5-3': { name: '火风鼎', order: 50, desc: '离上巽下，鼎新之卦。木上有火，鼎烹之象。宜除旧布新。' },
                '4-4': { name: '震为雷', order: 51, desc: '震上震下，重雷之卦。洊雷震，君子以恐惧修省。宜戒惧谨慎。' },
                '1-1': { name: '艮为山', order: 52, desc: '艮上艮下，重山之卦。兼山艮，君子以思不出其位。宜知止守分。' },
                '3-1': { name: '风山渐', order: 53, desc: '巽上艮下，渐进之卦。山上有木，渐长渐进。宜循序渐进。' },
                '4-6': { name: '雷泽归妹', order: 54, desc: '震上兑下，归妹之卦。泽上有雷，少女归嫁。宜慎重婚配。' },
                '4-5': { name: '雷火丰', order: 55, desc: '震上离下，丰大之卦。雷电皆至，丰盛之象。宜居安思危。' },
                '5-1': { name: '火山旅', order: 56, desc: '离上艮下，旅居之卦。山上有火，旅居在外。宜谨慎行事。' },
                '3-3': { name: '巽为风', order: 57, desc: '巽上巽下，重风之卦。随风巽，君子以申命行事。宜顺从天命。' },
                '6-6': { name: '兑为泽', order: 58, desc: '兑上兑下，重泽之卦。丽泽兑，君子以朋友讲习。宜和悦相处。' },
                '3-2': { name: '风水涣', order: 59, desc: '巽上坎下，涣散之卦。风行水上，涣散分离。宜凝聚人心。' },
                '2-6': { name: '水泽节', order: 60, desc: '坎上兑下，节制之卦。泽上有水，节度有制。宜适可而止。' },
                '3-6': { name: '风泽中孚', order: 61, desc: '巽上兑下，中孚之卦。泽上有风，诚信感化。宜以诚待人。' },
                '4-1': { name: '雷山小过', order: 62, desc: '震上艮下，小过之卦。山上有雷，小有过越。宜纠偏守中。' },
                '2-5': { name: '水火既济', order: 63, desc: '坎上离下，既济之卦。水在火上，事已成就。宜居安思危。' },
                '5-2': { name: '火水未济', order: 64, desc: '离上坎下，未济之卦。火在水上，事未完成。宜继续努力。' },
            };

            // ============ 状态 ============
            // yaoValues: 6个爻位，索引0=初爻(最下), 索引5=上爻(最上)
            // true=阳爻(—), false=阴爻(- -)
            let yaoValues = [true, true, true, true, true, true]; // 默认全阳(乾为天)
            let currentGuaKey = null;
            let isExplaining = false;

            // ============ DOM引用 ============
            const yaoSelector = document.getElementById('yaoSelector');
            const hexagramVisual = document.getElementById('hexagramVisual');
            const guaName = document.getElementById('guaName');
            const guaNumber = document.getElementById('guaNumber');
            const guaTags = document.getElementById('guaTags');
            const explanationBox = document.getElementById('explanationBox');
            const localInfo = document.getElementById('localInfo');
            const btnExplain = document.getElementById('btnExplain');
            const btnRandom = document.getElementById('btnRandom');
            const btnClear = document.getElementById('btnClear');
            const btnFlipAll = document.getElementById('btnFlipAll');
            const btnToggleSettings = document.getElementById('btnToggleSettings');
            const settingsPanel = document.getElementById('settingsPanel');
            const btnSaveSettings = document.getElementById('btnSaveSettings');
            const btnResetSettings = document.getElementById('btnResetSettings');
            const toast = document.getElementById('toast');

            // ============ 设置管理 ============
            const DEFAULT_SETTINGS = {
                apiKey: '',
                apiBase: 'https://api.openai.com/v1',
                apiModel: 'gpt-4o-mini',
                apiSystemPrompt: '你是一位精通周易六十四卦的专家。请直接对以下卦象进行简短精炼的解释，涵盖卦名含义、核心寓意、对问卦者的启示。直接输出解释内容，不需要任何开场白、问候语或确认语句。控制在200字以内。结合网络搜索结果进行补充说明（如有）。',
            };

            function loadSettings() {
                try {
                    const saved = localStorage.getItem('liuyao_settings');
                    if (saved) {
                        return { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
                    }
                } catch (e) { /* ignore */ }
                return { ...DEFAULT_SETTINGS };
            }

            function saveSettings(settings) {
                try {
                    localStorage.setItem('liuyao_settings', JSON.stringify(settings));
                } catch (e) { /* ignore */ }
            }

            function populateSettingsForm(settings) {
                document.getElementById('apiKey').value = settings.apiKey || '';
                document.getElementById('apiBase').value = settings.apiBase || DEFAULT_SETTINGS.apiBase;
                document.getElementById('apiModel').value = settings.apiModel || DEFAULT_SETTINGS.apiModel;
                document.getElementById('apiSystemPrompt').value = settings.apiSystemPrompt || DEFAULT_SETTINGS
                    .apiSystemPrompt;
            }

            let currentSettings = loadSettings();
            populateSettingsForm(currentSettings);

            // ============ Toast ============
            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ============ 计算卦象 ============
            function getTrigramValue(startIndex) {
                // startIndex: 0=下卦(初爻,二爻,三爻), 3=上卦(四爻,五爻,上爻)
                let val = 0;
                for (let i = 0; i < 3; i++) {
                    if (yaoValues[startIndex + i]) {
                        val += (1 << i); // 从下往上，低位=初爻
                    }
                }
                return val; // 0-7
            }

            function getGuaKey() {
                const upperVal = getTrigramValue(3); // 上卦(四爻,五爻,上爻)
                const lowerVal = getTrigramValue(0); // 下卦(初爻,二爻,三爻)
                return `${upperVal}-${lowerVal}`;
            }

            function getGuaInfo() {
                const key = getGuaKey();
                const info = GUA_DATABASE[key];
                const upperVal = getTrigramValue(3);
                const lowerVal = getTrigramValue(0);
                return {
                    key,
                    info,
                    upperVal,
                    lowerVal,
                    upperName: BA_GUA_NAMES[upperVal],
                    lowerName: BA_GUA_NAMES[lowerVal],
                    upperSymbol: BA_GUA_SYMBOLS[upperVal],
                    lowerSymbol: BA_GUA_SYMBOLS[lowerVal],
                    upperElement: BA_GUA_ELEMENTS[upperVal],
                    lowerElement: BA_GUA_ELEMENTS[lowerVal],
                };
            }

            // ============ 渲染 ============
            const YAO_LABELS = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
            const YAO_POSITION_NAMES = ['初', '二', '三', '四', '五', '上'];

            function renderYaoSelector() {
                yaoSelector.innerHTML = '';
                // 从下往上显示：初爻(index 0)在最下面，上爻(index 5)在最上面
                // UI中从上往下排列：上爻在最上面，初爻在最下面
                for (let i = 5; i >= 0; i--) {
                    const isYang = yaoValues[i];
                    const positionName = YAO_POSITION_NAMES[i];
                    const yaoName = isYang ? `九${positionName}` : `六${positionName}`;
                    // 对于初爻和上爻，称谓略有不同
                    let displayYaoName;
                    if (i === 0) {
                        displayYaoName = isYang ? '初九' : '初六';
                    } else if (i === 5) {
                        displayYaoName = isYang ? '上九' : '上六';
                    } else {
                        displayYaoName = yaoName;
                    }

                    const row = document.createElement('div');
                    row.className = 'yao-row';
                    row.setAttribute('data-index', i);
                    row.innerHTML = `
                        <span class="yao-label">${YAO_LABELS[i]}</span>
                        <div class="yao-display">
                            <span class="yao-symbol ${isYang ? 'yang' : 'yin'}">${isYang ? '━━━━━' : '━ ━ ━'}</span>
                        </div>
                        <span class="yao-indicator ${isYang ? 'active-yang' : 'active-yin'}">${displayYaoName}</span>
                    `;
                    row.addEventListener('click', () => {
                        yaoValues[i] = !yaoValues[i];
                        updateAll();
                        // 添加微小的触觉反馈模拟
                        row.style.transform = 'scale(0.94)';
                        setTimeout(() => { row.style.transform = ''; }, 120);
                    });
                    yaoSelector.appendChild(row);

                    // 在爻之间添加分隔线（除了最后一个即最上面的上爻之后）
                    if (i > 0) {
                        const divider = document.createElement('hr');
                        divider.className = 'yao-divider';
                        yaoSelector.appendChild(divider);
                    }
                }
            }

            function renderHexagramVisual() {
                hexagramVisual.innerHTML = '';
                // 从下往上显示：初爻(index 0)在下，上爻(index 5)在上
                // UI中从上往下排列
                for (let i = 5; i >= 0; i--) {
                    const isYang = yaoValues[i];
                    const lineDiv = document.createElement('div');
                    lineDiv.className = `hex-line ${isYang ? 'yang' : 'yin'}`;
                    if (isYang) {
                        lineDiv.innerHTML = `<span class="hex-line-label">${YAO_LABELS[i]}</span><div class="bar"></div>`;
                    } else {
                        lineDiv.innerHTML =
                            `<span class="hex-line-label">${YAO_LABELS[i]}</span><div class="bar-left"></div><div class="gap"></div><div class="bar-right"></div>`;
                    }
                    hexagramVisual.appendChild(lineDiv);
                }
            }

            function renderResult() {
                const guaData = getGuaInfo();
                currentGuaKey = guaData.key;

                if (guaData.info) {
                    guaName.textContent = guaData.info.name;
                    guaNumber.textContent = `周易第${guaData.info.order}卦`;
                    guaTags.innerHTML = `
                        <span class="gua-tag">上卦：${guaData.upperSymbol} ${guaData.upperName}(${guaData.upperElement})</span>
                        <span class="gua-tag">下卦：${guaData.lowerSymbol} ${guaData.lowerName}(${guaData.lowerElement})</span>
                    `;
                    localInfo.textContent = guaData.info.desc;
                    btnExplain.disabled = false;
                } else {
                    // 理论上不会出现，因为覆盖了64卦
                    guaName.textContent = '未知卦象';
                    guaNumber.textContent = '';
                    guaTags.innerHTML = `
                        <span class="gua-tag">上卦：${guaData.upperSymbol} ${guaData.upperName}</span>
                        <span class="gua-tag">下卦：${guaData.lowerSymbol} ${guaData.lowerName}</span>
                    `;
                    localInfo.textContent = '（数据库未匹配到此卦象，请检查爻位设置）';
                    btnExplain.disabled = true;
                }
                // 清除之前的AI解释
                explanationBox.innerHTML =
                    '<span style="color:var(--text-muted);">点击「AI 解卦」获取详细解释</span>';
            }

            function updateAll() {
                renderYaoSelector();
                renderHexagramVisual();
                renderResult();
            }

            // ============ AI 解释 ============
            async function fetchAIExplanation() {
                if (isExplaining) return;
                const guaData = getGuaInfo();
                if (!guaData.info) {
                    showToast('请先选择有效的卦象');
                    return;
                }

                const settings = loadSettings();
                if (!settings.apiKey || settings.apiKey.trim() === '') {
                    showToast('请先在API设置中填入API Key');
                    // 自动展开设置面板
                    settingsPanel.classList.add('open');
                    document.getElementById('apiKey').focus();
                    return;
                }

                isExplaining = true;
                btnExplain.disabled = true;
                btnExplain.textContent = '⏳ 解读中...';
                explanationBox.classList.add('loading');
                explanationBox.innerHTML = '<span class="spinner"></span> AI正在解读卦象...';

                const guaInfo = guaData.info;
                const userPrompt = `请解读以下卦象：
                卦名：${guaInfo.name}
                周易序号：第${guaInfo.order}卦
                上卦：${guaData.upperName}(${guaData.upperElement}) ${guaData.upperSymbol}
                下卦：${guaData.lowerName}(${guaData.lowerElement}) ${guaData.lowerSymbol}
                六爻（从下往上）：${yaoValues.map((y, i) => {
                    const pos = YAO_POSITION_NAMES[i];
                    if (i === 0) return y ? '初九' : '初六';
                    if (i === 5) return y ? '上九' : '上六';
                    return y ? `九${pos}` : `六${pos}`;
                }).join('、')}
                请直接输出简短解释。`;

                const systemPrompt = settings.apiSystemPrompt || DEFAULT_SETTINGS.apiSystemPrompt;

                try {
                    const response = await fetch(`${settings.apiBase}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${settings.apiKey}`,
                        },
                        body: JSON.stringify({
                            model: settings.apiModel,
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: userPrompt },
                            ],
                            max_tokens: 400,
                            temperature: 0.6,
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(
                            errorData.error?.message || `API请求失败 (HTTP ${response.status})`
                        );
                    }

                    const data = await response.json();
                    const aiText = data.choices?.[0]?.message?.content || '（AI未返回有效内容）';

                    explanationBox.classList.remove('loading');
                    explanationBox.textContent = aiText;
                    showToast('✅ AI解读完成');
                } catch (error) {
                    explanationBox.classList.remove('loading');
                    explanationBox.innerHTML =
                        `<span style="color:#c0392b;">❌ 解读失败：${escapeHTML(error.message)}</span>
                        <br><span style="font-size:0.75rem;color:var(--text-muted);">请检查API设置是否正确（Key、Base URL、模型名称）</span>`;
                    showToast('❌ AI解读失败，请检查API设置');
                } finally {
                    isExplaining = false;
                    btnExplain.disabled = false;
                    btnExplain.textContent = '🔮 AI 解卦';
                }
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ============ 按钮事件 ============
            btnExplain.addEventListener('click', fetchAIExplanation);

            btnRandom.addEventListener('click', () => {
                for (let i = 0; i < 6; i++) {
                    yaoValues[i] = Math.random() > 0.5;
                }
                updateAll();
                showToast('🎲 已随机生成卦象');
            });

            btnClear.addEventListener('click', () => {
                yaoValues = [true, true, true, true, true, true];
                updateAll();
                showToast('↺ 已重置为乾为天');
            });

            btnFlipAll.addEventListener('click', () => {
                for (let i = 0; i < 6; i++) {
                    yaoValues[i] = !yaoValues[i];
                }
                updateAll();
                showToast('⇄ 已全部翻转');
            });

            btnToggleSettings.addEventListener('click', () => {
                settingsPanel.classList.toggle('open');
                if (settingsPanel.classList.contains('open')) {
                    const s = loadSettings();
                    populateSettingsForm(s);
                }
            });

            btnSaveSettings.addEventListener('click', () => {
                const newSettings = {
                    apiKey: document.getElementById('apiKey').value.trim(),
                    apiBase: document.getElementById('apiBase').value.trim() || DEFAULT_SETTINGS.apiBase,
                    apiModel: document.getElementById('apiModel').value.trim() || DEFAULT_SETTINGS.apiModel,
                    apiSystemPrompt: document.getElementById('apiSystemPrompt').value.trim() || DEFAULT_SETTINGS
                        .apiSystemPrompt,
                };
                saveSettings(newSettings);
                currentSettings = newSettings;
                showToast('💾 设置已保存');
                settingsPanel.classList.remove('open');
            });

            btnResetSettings.addEventListener('click', () => {
                saveSettings(DEFAULT_SETTINGS);
                currentSettings = { ...DEFAULT_SETTINGS };
                populateSettingsForm(DEFAULT_SETTINGS);
                showToast('↺ 已恢复默认设置');
            });

            // ============ 键盘快捷键 ============
            document.addEventListener('keydown', (e) => {
                // 数字键1-6切换对应爻位（1=初爻, 6=上爻）
                if (e.key >= '1' && e.key <= '6' && !e.target.closest('input') && !e.target.closest(
                        'textarea') && !e.target.closest('select')) {
                    const index = parseInt(e.key) - 1; // 0-5，0=初爻
                    yaoValues[index] = !yaoValues[index];
                    updateAll();
                    // 高亮对应行
                    const row = yaoSelector.querySelector(`[data-index="${index}"]`);
                    if (row) {
                        row.style.background = 'rgba(201,169,110,0.15)';
                        setTimeout(() => { row.style.background = ''; }, 200);
                    }
                }
                // R键随机
                if (e.key === 'r' && !e.target.closest('input') && !e.target.closest('textarea') && !e.target
                    .closest('select')) {
                    btnRandom.click();
                }
                // Enter键触发AI解卦
                if (e.key === 'Enter' && !e.target.closest('input') && !e.target.closest('textarea') && !e.target
                    .closest('select') && !btnExplain.disabled && !isExplaining) {
                    e.preventDefault();
                    btnExplain.click();
                }
            });

            // ============ 初始化 ============
            function init() {
                updateAll();
                // 初始显示乾为天
                console.log('☯ 六爻占卜网站已就绪');
                console.log('  快捷键：数字1-6切换爻位 | R随机 | Enter解卦');
                console.log('  当前卦象：' + (getGuaInfo().info?.name || '未知'));
            }

            init();
        })();
    </script>
</body>
</html>
