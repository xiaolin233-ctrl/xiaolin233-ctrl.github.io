<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六爻占卜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Noto Serif SC', 'KaiTi', serif;
            background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d5 50%, #dfd6c8 100%);
            background-attachment: fixed;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        .card {
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 28px; padding: 24px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .header {
            text-align: center; padding: 12px 0 4px;
            font-size: 1.6rem; font-weight: 600; color: #5e4b3c;
            background: none; border: none; backdrop-filter: none; box-shadow: none;
        }
        .yao-selector { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .yao-row {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 8px 12px; border-radius: 16px; cursor: pointer;
            transition: all 0.2s; user-select: none; background: transparent;
        }
        .yao-row:hover { background: rgba(255,255,255,0.4); }
        .yao-label { width: 38px; font-size: 0.75rem; color: #9b8c7c; text-align: right; font-weight: 500; }
        .yao-symbol { flex: 1; text-align: center; font-size: 1.5rem; font-weight: 600; }
        .yao-symbol.yang { color: #b8956a; }
        .yao-symbol.yin { color: #7a8b9e; }
        .yao-indicator { width: 40px; font-size: 0.75rem; color: #5e4b3c; font-weight: 600; }
        .gua-name { text-align: center; font-size: 1.5rem; font-weight: 700; color: #5e4b3c; margin: 12px 0 6px; }
        .gua-tags { text-align: center; font-size: 0.8rem; color: #8b7b6b; margin-bottom: 12px; }
        .btn {
            display: inline-flex; align-items: center; gap: 4px; padding: 10px 20px;
            border-radius: 20px; border: none; background: rgba(255,255,255,0.45);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #5e4b3c; font-size: 0.85rem; font-weight: 500; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn:hover { background: rgba(255,255,255,0.65); }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: rgba(184,148,62,0.85); color: white; font-weight: 600; }
        .btn-primary:hover { background: rgba(184,148,62,1); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; background: rgba(184,148,62,0.5); }
        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        /* 弹窗滚动 */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.2); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 999; opacity: 0; pointer-events: none; transition: 0.25s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: 32px; padding: 24px; max-width: 360px; width: 90%;
            max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.6);
            position: relative; color: #4a3f35;
        }
        .modal-close {
            position: absolute; top:14px; right:16px; z-index:10;
            background: rgba(0,0,0,0.05); border: none; width: 28px; height: 28px;
            border-radius: 14px; font-size: 1.1rem; color: #7a6e60; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; text-align: center; color: #5e4b3c; }
        .modal-body {
            font-size: 0.9rem; line-height: 1.7; color: #4a3f35;
            white-space: pre-wrap; word-break: break-word;
            overflow-y: auto; max-height: 55vh; padding-right: 4px;
        }
        .domain-btn, .length-btn {
            margin: 4px; padding: 6px 16px; border-radius: 16px; font-size: 0.8rem;
            background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,0,0.08);
        }
        .domain-btn.active, .length-btn.active { background: rgba(184,148,62,0.25); border-color: rgba(184,148,62,0.5); }
        .toast {
            position: fixed; top:20px; left:50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.7); backdrop-filter: blur(16px);
            padding: 8px 20px; border-radius: 20px; font-size: 0.8rem;
            color: #5e4b3c; opacity: 0; transition: 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(184,148,62,0.2); border-top-color: #b8943e; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .settings-row { margin-bottom: 10px; }
        .settings-row label { font-size: 0.7rem; color: #7a6e60; display: block; margin-bottom: 4px; }
        .settings-row input { width: 100%; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.35); font-size: 0.8rem; color: #4a3f35; outline: none; }
        .settings-row input:focus { border-color: #b8943e; background: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">☯ 六爻占卜</div>

        <div class="card">
            <div class="yao-selector" id="yaoSelector"></div>
            <div class="btn-group">
                <button class="btn btn-sm" id="btnRandom">🎲随机</button>
                <button class="btn btn-sm" id="btnClear">↺重置</button>
                <button class="btn btn-sm" id="btnFlipAll">⇄翻转</button>
            </div>
        </div>

        <div class="card" style="text-align:center;">
            <div class="gua-name" id="guaName">—</div>
            <div class="gua-tags" id="guaTags"></div>
            <button class="btn btn-primary" id="btnExplain" disabled>🔮 AI 解卦</button>
        </div>

        <div style="text-align:center;">
            <button class="btn btn-sm" id="btnSettings" style="background: rgba(255,255,255,0.3);">⚙️ API</button>
        </div>
        <div class="card" id="settingsPanel" style="display:none;">
            <div class="settings-row">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">
            </div>
            <div class="settings-row">
                <label>API Base URL</label>
                <input type="text" id="apiBase" placeholder="https://api.deepseek.com">
            </div>
            <div class="settings-row" style="display:flex;align-items:flex-end;gap:6px;">
                <div style="flex:1;">
                    <label>模型</label>
                    <input type="text" id="apiModel" placeholder="deepseek-chat">
                </div>
                <button class="btn" id="btnTest" style="padding:8px 12px;font-size:0.7rem;">测试</button>
            </div>
            <button class="btn btn-primary" id="btnSave" style="width:100%;margin-top:8px;">保存</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const GUA_DB = {
            '7-7':{n:'乾为天',o:1,d:'元亨利贞。天行健，君子以自强不息。'},
            '0-0':{n:'坤为地',o:2,d:'元亨，利牝马之贞。地势坤，君子以厚德载物。'},
            '2-4':{n:'水雷屯',o:3,d:'万物始生，艰难重重。宜守正待时。'},
            '1-2':{n:'山水蒙',o:4,d:'蒙昧启智，山下有险。需耐心引导。'},
            '2-7':{n:'水天需',o:5,d:'云上于天，待时而雨。宜静候时机。'},
            '7-2':{n:'天水讼',o:6,d:'天与水违行，争讼难解。宜和解。'},
            '0-2':{n:'地水师',o:7,d:'地中有水，聚众用兵。宜师出有名。'},
            '2-0':{n:'水地比',o:8,d:'地上有水，万物亲附。宜团结协作。'},
            '3-7':{n:'风天小畜',o:9,d:'风行天上，小有积蓄。宜积小成大。'},
            '7-6':{n:'天泽履',o:10,d:'上天下泽，循礼而行。宜谨慎行事。'},
            '0-7':{n:'地天泰',o:11,d:'天地交泰，万物通亨。大吉之象。'},
            '7-0':{n:'天地否',o:12,d:'天地不交，万物不通。宜退守自保。'},
            '7-5':{n:'天火同人',o:13,d:'天与火同，类族辨物。宜广结善缘。'},
            '5-7':{n:'火天大有',o:14,d:'火在天上，无所不照。丰收大有之年。'},
            '0-1':{n:'地山谦',o:15,d:'地中有山，卑以自牧。谦受益，满招损。'},
            '4-0':{n:'雷地豫',o:16,d:'雷出地奋，和乐愉悦。宜顺势而动。'},
            '6-4':{n:'泽雷随',o:17,d:'泽中有雷，随时而动。宜顺应时势。'},
            '1-3':{n:'山风蛊',o:18,d:'山下有风，物腐虫生。宜整治弊病。'},
            '0-6':{n:'地泽临',o:19,d:'地临泽上，君临天下。宜亲民治事。'},
            '3-0':{n:'风地观',o:20,d:'风行地上，周观四方。宜审时度势。'},
            '5-4':{n:'火雷噬嗑',o:21,d:'雷电交加，刑狱断案。宜明断是非。'},
            '1-5':{n:'山火贲',o:22,d:'山下有火，文饰之美。宜注重内涵。'},
            '1-0':{n:'山地剥',o:23,d:'山附于地，剥蚀衰落。宜守正待时。'},
            '0-4':{n:'地雷复',o:24,d:'雷在地中，一阳来复。宜回归正道。'},
            '7-4':{n:'天雷无妄',o:25,d:'天下雷行，真实无妄。宜诚实守正。'},
            '1-7':{n:'山天大畜',o:26,d:'天在山中，厚积薄发。宜蓄养待发。'},
            '1-4':{n:'山雷颐',o:27,d:'山下有雷，养正之道。宜自食其力。'},
            '6-3':{n:'泽风大过',o:28,d:'泽灭木，过犹不及。宜调整平衡。'},
            '2-2':{n:'坎为水',o:29,d:'水流不息，习坎行险。宜诚信守中。'},
            '5-5':{n:'离为火',o:30,d:'日月丽天，光明继照。宜依附中正。'},
            '6-1':{n:'泽山咸',o:31,d:'山上有泽，男女感应。宜以诚相待。'},
            '4-3':{n:'雷风恒',o:32,d:'雷风相与，恒久不变。宜持之以恒。'},
            '7-1':{n:'天山遁',o:33,d:'天下有山，君子退隐。宜适时退避。'},
            '4-7':{n:'雷天大壮',o:34,d:'雷在天上，声势壮大。宜守正防过。'},
            '5-0':{n:'火地晋',o:35,d:'明出地上，光明上进。宜稳步前进。'},
            '0-5':{n:'地火明夷',o:36,d:'明入地中，光明受伤。宜韬光养晦。'},
            '3-5':{n:'风火家人',o:37,d:'风自火出，家道兴旺。宜和睦治家。'},
            '5-6':{n:'火泽睽',o:38,d:'上火下泽，二女同居。宜求同存异。'},
            '2-1':{n:'水山蹇',o:39,d:'山上有水，险阻难行。宜反求诸己。'},
            '4-2':{n:'雷水解',o:40,d:'雷雨作，百果草木皆甲坼。宜宽恕化解。'},
            '1-6':{n:'山泽损',o:41,d:'山下有泽，损下益上。宜节制减损。'},
            '3-4':{n:'风雷益',o:42,d:'风雷相益，损上益下。宜增益善行。'},
            '6-7':{n:'泽天夬',o:43,d:'泽上于天，决而和。宜果敢决断。'},
            '7-3':{n:'天风姤',o:44,d:'天下有风，不期而遇。宜谨慎应对。'},
            '6-0':{n:'泽地萃',o:45,d:'泽上于地，万物萃聚。宜聚集人才。'},
            '0-3':{n:'地风升',o:46,d:'地中生木，步步高升。宜循序渐进。'},
            '6-2':{n:'泽水困',o:47,d:'泽无水，困穷之象。宜坚守正道。'},
            '2-3':{n:'水风井',o:48,d:'木上有水，井养不穷。宜修德养民。'},
            '6-5':{n:'泽火革',o:49,d:'泽中有火，变革之象。宜顺天应人。'},
            '5-3':{n:'火风鼎',o:50,d:'木上有火，鼎烹之象。宜除旧布新。'},
            '4-4':{n:'震为雷',o:51,d:'洊雷震，君子以恐惧修省。宜戒惧谨慎。'},
            '1-1':{n:'艮为山',o:52,d:'兼山艮，思不出其位。宜知止守分。'},
            '3-1':{n:'风山渐',o:53,d:'山上有木，渐长渐进。宜循序渐进。'},
            '4-6':{n:'雷泽归妹',o:54,d:'泽上有雷，少女归嫁。宜慎重婚配。'},
            '4-5':{n:'雷火丰',o:55,d:'雷电皆至，丰盛之象。宜居安思危。'},
            '5-1':{n:'火山旅',o:56,d:'山上有火，旅居在外。宜谨慎行事。'},
            '3-3':{n:'巽为风',o:57,d:'随风巽，申命行事。宜顺从天命。'},
            '6-6':{n:'兑为泽',o:58,d:'丽泽兑，朋友讲习。宜和悦相处。'},
            '3-2':{n:'风水涣',o:59,d:'风行水上，涣散分离。宜凝聚人心。'},
            '2-6':{n:'水泽节',o:60,d:'泽上有水，节度有制。宜适可而止。'},
            '3-6':{n:'风泽中孚',o:61,d:'泽上有风，诚信感化。宜以诚待人。'},
            '4-1':{n:'雷山小过',o:62,d:'山上有雷，小有过越。宜纠偏守中。'},
            '2-5':{n:'水火既济',o:63,d:'水在火上，事已成就。宜居安思危。'},
            '5-2':{n:'火水未济',o:64,d:'火在水上，事未完成。宜继续努力。'}
        };

        let yao = [1,1,1,1,1,1]; // 0初爻…5上爻
        let domain = '综合';
        let lengthMode = 'medium'; // 简短/标准/详细
        const LS_KEY = 'liuyao';
        const $ = id => document.getElementById(id);
        const toast = $('toast');

        function showToast(m) { toast.textContent=m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2000); }

        function getGuaKey() {
            const lower = (yao[0]?4:0) + (yao[1]?2:0) + (yao[2]?1:0);
            const upper = (yao[3]?4:0) + (yao[4]?2:0) + (yao[5]?1:0);
            return `${upper}-${lower}`;
        }

        function updateDisplay() {
            const yaoNames = ['初','二','三','四','五','上'];
            const sel = $('yaoSelector');
            sel.innerHTML = '';
            for(let i=5;i>=0;i--) {
                const yang = yao[i];
                const label = yaoNames[i]+'爻';
                let name;
                if(i===0) name = yang?'初九':'初六';
                else if(i===5) name = yang?'上九':'上六';
                else { const mid=['二','三','四','五']; name = yang?'九'+mid[i-1]:'六'+mid[i-1]; }
                const row = document.createElement('div');
                row.className = 'yao-row';
                row.innerHTML = `<span class="yao-label">${label}</span><span class="yao-symbol ${yang?'yang':'yin'}">${yang?'━━━━━':'━ ━ ━'}</span><span class="yao-indicator">${name}</span>`;
                row.onclick = () => { yao[i] = yao[i]?0:1; updateDisplay(); };
                sel.appendChild(row);
            }
            const key = getGuaKey();
            const info = GUA_DB[key];
            $('guaName').textContent = info ? info.n : '未知卦象';
            $('guaTags').innerHTML = info ? `第${info.o}卦 · ${info.d}` : '';
            $('btnExplain').disabled = !info;
        }

        function showDomainModal() {
            $('modalTitle').textContent = '选择领域与长度';
            $('modalBody').innerHTML = `
                <div style="margin-bottom:12px;text-align:center;font-size:0.8rem;color:#7a6e60;">领域</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">
                    ${['情感','事业','健康','学业','综合'].map(d => `<button class="domain-btn btn ${d===domain?'active':''}" data-d="${d}">${d}</button>`).join('')}
                </div>
                <div style="margin:18px 0 8px;text-align:center;font-size:0.8rem;color:#7a6e60;">解释长度</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">
                    ${['简短','标准','详细'].map(m => `<button class="length-btn btn ${m===lengthMode?'active':''}" data-len="${m}">${m}</button>`).join('')}
                </div>
                <div style="text-align:center;margin-top:20px;">
                    <button class="btn btn-primary" id="startBtn">开始解读</button>
                </div>`;
            // 领域绑定
            $('modalBody').querySelectorAll('.domain-btn').forEach(b => {
                b.onclick = function() {
                    $('modalBody').querySelectorAll('.domain-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    domain = this.dataset.d;
                };
            });
            // 长度绑定
            $('modalBody').querySelectorAll('.length-btn').forEach(b => {
                b.onclick = function() {
                    $('modalBody').querySelectorAll('.length-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    lengthMode = this.dataset.len;
                };
            });
            $('modalBody').querySelector('#startBtn').onclick = startAI;
            $('modal').classList.add('active');
        }

        function getSettings() {
            const def = {apiKey:'', apiBase:'https://api.deepseek.com', apiModel:'deepseek-chat'};
            try { return Object.assign(def, JSON.parse(localStorage.getItem(LS_KEY)||'{}')); } catch(e) { return def; }
        }

        async function testConnection() {
            const s = getSettings();
            if(!s.apiKey) { showToast('请填写API Key'); return; }
            const btn = $('btnTest'); btn.disabled = true; btn.textContent = '测试中';
            try {
                const res = await fetch(`${s.apiBase}/chat/completions`, {
                    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.apiKey}`},
                    body: JSON.stringify({model:s.apiModel, messages:[{role:'user',content:'ping'}], max_tokens:5})
                });
                if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error?.message || `HTTP ${res.status}`);
                showToast('✅ 连接成功');
            } catch(e) { showToast('❌ '+e.message); }
            finally { btn.disabled = false; btn.textContent = '测试'; }
        }

        async function startAI() {
            const s = getSettings();
            if(!s.apiKey) { showToast('请设置API Key'); $('modal').classList.remove('active'); return; }
            $('modalTitle').textContent = 'AI 解读中';
            $('modalBody').innerHTML = '<span class="spinner"></span> 分析中...';
            const info = GUA_DB[getGuaKey()];
            const yaoNames = ['初','二','三','四','五','上'];
            // 根据长度模式设定字数与tokens
            let wordCount, maxTokens;
            if(lengthMode === '简短') { wordCount = '约100字'; maxTokens = 300; }
            else if(lengthMode === '详细') { wordCount = '约500字'; maxTokens = 1200; }
            else { wordCount = '约300字'; maxTokens = 800; } // 标准
            const prompt = `卦：${info.n}（第${info.o}卦），卦辞：${info.d}。六爻（从下往上）：${yao.map((v,i)=>yaoNames[i]+(v?'九':'六')).join('、')}。请直接给出针对【${domain}】的解读与建议，${wordCount}。`;
            try {
                const res = await fetch(`${s.apiBase}/chat/completions`, {
                    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.apiKey}`},
                    body: JSON.stringify({model:s.apiModel, messages:[{role:'user',content:prompt}], max_tokens:maxTokens})
                });
                if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error?.message || `HTTP ${res.status}`);
                const data = await res.json();
                $('modalBody').textContent = data.choices?.[0]?.message?.content || 'AI未返回内容';
            } catch(e) { $('modalBody').innerHTML = `<span style="color:#c0392b;">错误：${e.message}</span>`; }
        }

        $('btnRandom').onclick = () => { yao = yao.map(()=>Math.random()>0.5?1:0); updateDisplay(); };
        $('btnClear').onclick = () => { yao = [1,1,1,1,1,1]; updateDisplay(); };
        $('btnFlipAll').onclick = () => { yao = yao.map(v=>v?0:1); updateDisplay(); };
        $('btnExplain').onclick = showDomainModal;
        $('btnSettings').onclick = () => { const p = $('settingsPanel'); p.style.display = p.style.display==='none'?'block':'none'; };
        $('btnSave').onclick = () => {
            localStorage.setItem(LS_KEY, JSON.stringify({apiKey:$('apiKey').value, apiBase:$('apiBase').value, apiModel:$('apiModel').value}));
            showToast('已保存'); $('settingsPanel').style.display='none';
        };
        $('btnTest').onclick = testConnection;
        $('modalClose').onclick = () => $('modal').classList.remove('active');
        $('modal').onclick = e => { if(e.target === $('modal')) $('modal').classList.remove('active'); };
        document.onkeydown = e => { if(e.key==='Escape') $('modal').classList.remove('active'); };

        (() => {
            const s = getSettings();
            $('apiKey').value = s.apiKey;
            $('apiBase').value = s.apiBase;
            $('apiModel').value = s.apiModel;
            updateDisplay();
        })();
    </script>
</body>
</html>
