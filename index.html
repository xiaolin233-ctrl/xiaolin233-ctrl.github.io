<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六爻占卜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Noto Serif SC', 'KaiTi', serif;
            background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d5 50%, #dfd6c8 100%);
            background-attachment: fixed;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        .card {
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 28px; padding: 24px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .header {
            text-align: center; padding: 12px 0 4px;
            font-size: 1.6rem; font-weight: 600; color: #5e4b3c;
            background: none; border: none; backdrop-filter: none; box-shadow: none;
        }
        .yao-selector { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .yao-row {
            display: flex; align-items: center; gap: 8px; width: 100%;
            padding: 6px 10px; border-radius: 16px; cursor: pointer;
            transition: all 0.2s; user-select: none; background: transparent;
        }
        .yao-row:hover { background: rgba(255,255,255,0.4); }
        .yao-label { width: 38px; font-size: 0.75rem; color: #9b8c7c; text-align: right; font-weight: 500; }
        .yao-symbol { flex: 1; text-align: center; font-size: 1.5rem; font-weight: 600; position: relative; }
        .yao-symbol .main { display: inline; }
        .yao-symbol .change-mark {
            font-size: 1.0rem; vertical-align: super; margin-left: 2px; font-weight: bold;
        }
        .yao-symbol.yang .main { color: #b8956a; }
        .yao-symbol.yin .main { color: #7a8b9e; }
        .yao-symbol.moving .change-mark { color: #c0392b; }
        .yao-indicator { width: 50px; font-size: 0.75rem; color: #5e4b3c; font-weight: 600; }
        .move-btn {
            width: 26px; height: 26px; border-radius: 13px;
            background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,0,0.1);
            font-size: 0.7rem; font-weight: 600; color: #5e4b3c;
            cursor: pointer; transition: 0.2s; display: flex;
            align-items: center; justify-content: center;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            margin-left: 2px;
        }
        .move-btn:hover { background: rgba(255,255,255,0.7); }
        .move-btn:active { transform: scale(0.9); }
        .move-btn.active { background: rgba(184,148,62,0.3); border-color: rgba(184,148,62,0.5); color: #b8956a; }
        .gua-name { text-align: center; font-size: 1.5rem; font-weight: 700; color: #5e4b3c; margin: 12px 0 6px; }
        .gua-tags { text-align: center; font-size: 0.8rem; color: #8b7b6b; margin-bottom: 12px; }
        .btn {
            display: inline-flex; align-items: center; gap: 4px; padding: 10px 20px;
            border-radius: 20px; border: none; background: rgba(255,255,255,0.45);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #5e4b3c; font-size: 0.85rem; font-weight: 500; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn:hover { background: rgba(255,255,255,0.65); }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: rgba(184,148,62,0.85); color: white; font-weight: 600; }
        .btn-primary:hover { background: rgba(184,148,62,1); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; background: rgba(184,148,62,0.5); }
        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.2); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 999; opacity: 0; pointer-events: none; transition: 0.25s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: 32px; padding: 24px; max-width: 360px; width: 90%;
            max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.6);
            position: relative; color: #4a3f35;
        }
        .modal-close {
            position: absolute; top:14px; right:16px; z-index:10;
            background: rgba(0,0,0,0.05); border: none; width: 28px; height: 28px;
            border-radius: 14px; font-size: 1.1rem; color: #7a6e60; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; text-align: center; color: #5e4b3c; }
        .modal-body {
            font-size: 0.9rem; line-height: 1.7; color: #4a3f35;
            white-space: pre-wrap; word-break: break-word;
            overflow-y: auto; max-height: 55vh; padding-right: 4px;
        }
        .domain-btn, .length-btn {
            margin: 4px; padding: 6px 16px; border-radius: 16px; font-size: 0.8rem;
            background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,0,0.08);
        }
        .domain-btn.active, .length-btn.active { background: rgba(184,148,62,0.25); border-color: rgba(184,148,62,0.5); }
        .toast {
            position: fixed; top:20px; left:50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.7); backdrop-filter: blur(16px);
            padding: 8px 20px; border-radius: 20px; font-size: 0.8rem;
            color: #5e4b3c; opacity: 0; transition: 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(184,148,62,0.2); border-top-color: #b8943e; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .settings-row { margin-bottom: 10px; }
        .settings-row label { font-size: 0.7rem; color: #7a6e60; display: block; margin-bottom: 4px; }
        .settings-row input { width: 100%; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.35); font-size: 0.8rem; color: #4a3f35; outline: none; }
        .settings-row input:focus { border-color: #b8943e; background: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">☯ 六爻占卜</div>
        <div class="card">
            <div class="yao-selector" id="yaoSelector"></div>
            <div class="btn-group">
                <button class="btn btn-sm" id="btnRandom">🎲随机</button>
                <button class="btn btn-sm" id="btnClear">↺重置</button>
                <button class="btn btn-sm" id="btnFlipMove">⇄动静互换</button>
            </div>
        </div>
        <div class="card" style="text-align:center;">
            <div class="gua-name" id="guaName">—</div>
            <div class="gua-tags" id="guaTags"></div>
            <button class="btn btn-primary" id="btnExplain" disabled>🔮 AI 解卦</button>
        </div>
        <div style="text-align:center;">
            <button class="btn btn-sm" id="btnSettings" style="background: rgba(255,255,255,0.3);">⚙️ API</button>
        </div>
        <div class="card" id="settingsPanel" style="display:none;">
            <div class="settings-row"><label>API Key</label><input type="password" id="apiKey" placeholder="sk-..."></div>
            <div class="settings-row"><label>API Base URL</label><input type="text" id="apiBase" placeholder="https://api.deepseek.com"></div>
            <div class="settings-row" style="display:flex;align-items:flex-end;gap:6px;">
                <div style="flex:1;"><label>模型</label><input type="text" id="apiModel" placeholder="deepseek-chat"></div>
                <button class="btn" id="btnTest" style="padding:8px 12px;font-size:0.7rem;">测试</button>
            </div>
            <button class="btn btn-primary" id="btnSave" style="width:100%;margin-top:8px;">保存</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const GUA_DB = {

            '4-0':{n:'雷地豫',o:16,d:'雷出地奋，和乐愉悦。宜顺势而动。'},

            '1-3':{n:'山风蛊',o:18,d:'山下有风，物腐虫生。宜整治弊病。'},
            '0-6':{n:'地泽临',o:19,d:'地临泽上，君临天下。宜亲民治事。'},
            '3-0':{n:'风地观',o:20,d:'风行地上，周观四方。宜审时度势。'},
            '5-4':{n:'火雷噬嗑',o:21,d:'雷电交加，刑狱断案。宜明断是非。'},
            '1-5':{n:'山火贲',o:22,d:'山下有火，文饰之美。宜注重内涵。'},
            '1-0':{n:'山地剥',o:23,d:'山附于地，剥蚀衰落。宜守正待时。'},
            '0-4':{n:'地雷复',o:24,d:'雷在地中，一阳来复。宜回归正道。'},
            '7-4':{n:'天雷无妄',o:25,d:'天下雷行，真实无妄。宜诚实守正。'},
            '1-7':{n:'山天大畜',o:26,d:'天在山中，厚积薄发。宜蓄养待发。'},
            '1-4':{n:'山雷颐',o:27,d:'山下有雷，养正之道。宜自食其力。'},
            '6-3':{n:'泽风大过',o:28,d:'泽灭木，过犹不及。宜调整平衡。'},
            '2-2':{n:'坎为水',o:29,d:'水流不息，习坎行险。宜诚信守中。'},
            '5-5':{n:'离为火',o:30,d:'日月丽天，光明继照。宜依附中正。'},
            '6-1':{n:'泽山咸',o:31,d:'山上有泽，男女感应。宜以诚相待。'},
            '4-3':{n:'雷风恒',o:32,d:'雷风相与，恒久不变。宜持之以恒。'},
            '7-1':{n:'天山遁',o:33,d:'天下有山，君子退隐。宜适时退避。'},
            '4-7':{n:'雷天大壮',o:34,d:'雷在天上，声势壮大。宜守正防过。'},
            '5-0':{n:'火地晋',o:35,d:'明出地上，光明上进。宜稳步前进。'},
            '0-5':{n:'地火明夷',o:36,d:'明入地中，光明受伤。宜韬光养晦。'},
            '3-5':{n:'风火家人',o:37,d:'风自火出，家道兴旺。宜和睦治家。'},
            '5-6':{n:'火泽睽',o:38,d:'上火下泽，二女同居。宜求同存异。'},
            '2-1':{n:'水山蹇',o:39,d:'山上有水，险阻难行。宜反求诸己。'},
            '4-2':{n:'雷水解',o:40,d:'雷雨作，百果草木皆甲坼。宜宽恕化解。'},
            '1-6':{n:'山泽损',o:41,d:'山下有泽，损下益上。宜节制减损。'},
            '3-4':{n:'风雷益',o:42,d:'风雷相益，损上益下。宜增益善行。'},
            '6-7':{n:'泽天夬',o:43,d:'泽上于天，决而和。宜果敢决断。'},
            '7-3':{n:'天风姤',o:44,d:'天下有风，不期而遇。宜谨慎应对。'},
            '6-0':{n:'泽地萃',o:45,d:'泽上于地，万物萃聚。宜聚集人才。'},
            '0-3':{n:'地风升',o:46,d:'地中生木，步步高升。宜循序渐进。'},
            '6-2':{n:'泽水困',o:47,d:'泽无水，困穷之象。宜坚守正道。'},
            '2-3':{n:'水风井',o:48,d:'木上有水，井养不穷。宜修德养民。'},
            '6-5':{n:'泽火革',o:49,d:'泽中有火，变革之象。宜顺天应人。'},
            '5-3':{n:'火风鼎',o:50,d:'木上有火，鼎烹之象。宜除旧布新。'},
            '4-4':{n:'震为雷',o:51,d:'洊雷震，君子以恐惧修省。宜戒惧谨慎。'},
            '1-1':{n:'艮为山',o:52,d:'兼山艮，思不出其位。宜知止守分。'},
            '3-1':{n:'风山渐',o:53,d:'山上有木，渐长渐进。宜循序渐进。'},
            '4-6':{n:'雷泽归妹',o:54,d:'泽上有雷，少女归嫁。宜慎重婚配。'},
            '4-5':{n:'雷火丰',o:55,d:'雷电皆至，丰盛之象。宜居安思危。'},
            '5-1':{n:'火山旅',o:56,d:'山上有火，旅居在外。宜谨慎行事。'},
            '3-3':{n:'巽为风',o:57,d:'随风巽，申命行事。宜顺从天命。'},
            '6-6':{n:'兑为泽',o:58,d:'丽泽兑，朋友讲习。宜和悦相处。'},
            '3-2':{n:'风水涣',o:59,d:'风行水上，涣散分离。宜凝聚人心。'},
            '2-6':{n:'水泽节',o:60,d:'泽上有水，节度有制。宜适可而止。'},
            '3-6':{n:'风泽中孚',o:61,d:'泽上有风，诚信感化。宜以诚待人。'},
            '4-1':{n:'雷山小过',o:62,d:'山上有雷，小有过越。宜纠偏守中。'},
            '2-5':{n:'水火既济',o:63,d:'水在火上，事已成就。宜居安思危。'},
            '5-2':{n:'火水未济',o:64,d:'火在水上，事未完成。宜继续努力。'}
        };

        // 0=静阴, 1=静阳, 2=阳动, 3=阴动
        let yao = [1,1,1,1,1,1];
        let domain = '综合';
        let lengthMode = '标准';
        const LS_KEY = 'liuyao';
        const $ = id => document.getElementById(id);
        const toast = $('toast');

        function showToast(m) { toast.textContent=m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2000); }

        function getGuaKeys() {
            let origL=0, origU=0, chL=0, chU=0;
            for(let i=0;i<6;i++){
                const st=yao[i];
                const isYang = (st===1||st===2);
                const willYang = (st===1||st===3);
                const w = (i%3===0)?4:(i%3===1)?2:1;
                if(i<3){ if(isYang) origL+=w; if(willYang) chL+=w; }
                else { if(isYang) origU+=w; if(willYang) chU+=w; }
            }
            return { origKey:`${origU}-${origL}`, changedKey:`${chU}-${chL}` };
        }

        function getMovingDescs() {
            const n=['初','二','三','四','五','上'];
            return yao.map((s,i)=>s===2?n[i]+'阳动':s===3?n[i]+'阴动':null).filter(Boolean).join('、')||'无';
        }

        function updateDisplay() {
            const n=['初','二','三','四','五','上'];
            const sel=$('yaoSelector'); sel.innerHTML='';
            for(let i=5;i>=0;i--){
                const st=yao[i];
                let css='', sym='';
                if(st===0){ css='yin'; sym='━ ━ ━'; }
                else if(st===1){ css='yang'; sym='━━━━━'; }
                else if(st===2){ css='yang moving'; sym='━━━━━○'; }
                else if(st===3){ css='yin moving'; sym='━ ━ ━×'; }
                const isYang=(st===1||st===2);
                let name;
                if(i===0) name=isYang?'初九':'初六';
                else if(i===5) name=isYang?'上九':'上六';
                else { const m=['二','三','四','五']; name=isYang?'九'+m[i-1]:'六'+m[i-1]; }
                if(st===2||st===3) name+='(动)';
                const row=document.createElement('div');
                row.className='yao-row';
                row.innerHTML = `<span class="yao-label">${n[i]}爻</span>
                    <span class="yao-symbol ${css}">${sym}</span>
                    <span class="yao-indicator">${name}</span>
                    <button class="move-btn ${(st===2||st===3)?'active':''}" data-idx="${i}">变</button>`;
                // 点击行切换阴阳
                row.addEventListener('click', (e) => {
                    if(e.target.classList.contains('move-btn')) return;
                    if(st===0||st===2) yao[i] = (st===0?1:3); // 阴变阳（静阴变静阳，阴动变阳动）
                    else yao[i] = (st===1?0:2); // 阳变阴
                    updateDisplay();
                });
                // 变按钮切换动静
                row.querySelector('.move-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(st===0) yao[i]=2; // 静阴变阳动
                    else if(st===1) yao[i]=3; // 静阳变阴动
                    else if(st===2) yao[i]=0; // 阳动变静阴
                    else yao[i]=1; // 阴动变静阳
                    updateDisplay();
                });
                sel.appendChild(row);
            }
            const {origKey, changedKey}=getGuaKeys();
            const oi=GUA_DB[origKey], ci=GUA_DB[changedKey];
            if(oi&&ci){
                $('guaName').textContent = origKey===changedKey ? oi.n : `${oi.n} → ${ci.n}`;
                $('guaTags').innerHTML = origKey===changedKey ? `第${oi.o}卦 · ${oi.d}` : `本卦第${oi.o}卦，变卦第${ci.o}卦`;
                $('btnExplain').disabled=false;
            } else { $('guaName').textContent='未知'; $('guaTags').innerHTML=''; $('btnExplain').disabled=true; }
        }

        function showDomainModal() {
            $('modalTitle').textContent='选择领域与长度';
            $('modalBody').innerHTML=`
                <div style="margin-bottom:12px;text-align:center;font-size:0.8rem;">领域</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">${['情感','事业','健康','学业','综合'].map(d=>`<button class="domain-btn btn ${d===domain?'active':''}" data-d="${d}">${d}</button>`).join('')}</div>
                <div style="margin:18px 0 8px;text-align:center;font-size:0.8rem;">长度</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">${['简短','标准','详细'].map(m=>`<button class="length-btn btn ${m===lengthMode?'active':''}" data-len="${m}">${m}</button>`).join('')}</div>
                <div style="text-align:center;margin-top:20px;"><button class="btn btn-primary" id="startBtn">开始解读</button></div>`;
            $('modalBody').querySelectorAll('.domain-btn').forEach(b=>b.onclick=function(){ $('modalBody').querySelectorAll('.domain-btn').forEach(x=>x.classList.remove('active')); this.classList.add('active'); domain=this.dataset.d; });
            $('modalBody').querySelectorAll('.length-btn').forEach(b=>b.onclick=function(){ $('modalBody').querySelectorAll('.length-btn').forEach(x=>x.classList.remove('active')); this.classList.add('active'); lengthMode=this.dataset.len; });
            $('modalBody').querySelector('#startBtn').onclick=startAI;
            $('modal').classList.add('active');
        }

        function getSettings(){ const d={apiKey:'',apiBase:'https://api.deepseek.com',apiModel:'deepseek-chat'}; try{return Object.assign(d,JSON.parse(localStorage.getItem(LS_KEY)||'{}'));}catch(e){return d;} }

        async function testConnection(){
            const s=getSettings(); if(!s.apiKey){showToast('请填写Key');return;}
            const btn=$('btnTest'); btn.disabled=true; btn.textContent='测试中';
            try{
                const r=await fetch(`${s.apiBase}/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.apiKey}`},body:JSON.stringify({model:s.apiModel,messages:[{role:'user',content:'ping'}],max_tokens:5})});
                if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error?.message||`HTTP ${r.status}`);
                showToast('✅ 连接成功');
            }catch(e){showToast('❌ '+e.message);}
            finally{btn.disabled=false;btn.textContent='测试';}
        }

        async function startAI(){
            const s=getSettings(); if(!s.apiKey){showToast('请设置Key');$('modal').classList.remove('active');return;}
            $('modalTitle').textContent='解读中'; $('modalBody').innerHTML='<span class="spinner"></span> 分析中...';
            const {origKey,changedKey}=getGuaKeys();
            const oi=GUA_DB[origKey], ci=GUA_DB[changedKey];
            const md=getMovingDescs();
            let wc,mt;
            if(lengthMode==='简短'){wc='约120字';mt=400;}
            else if(lengthMode==='详细'){wc='约500字';mt=1200;}
            else{wc='约300字';mt=800;}
            const prompt=origKey===changedKey?`卦：${oi.n}（第${oi.o}卦），无动爻。请针对【${domain}】解读，${wc}。`:
                `本卦：${oi.n}（第${oi.o}卦），变卦：${ci.n}（第${ci.o}卦）。动爻：${md}。请结合动变解读，针对【${domain}】给出启示，${wc}。`;
            try{
                const r=await fetch(`${s.apiBase}/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.apiKey}`},body:JSON.stringify({model:s.apiModel,messages:[{role:'user',content:prompt}],max_tokens:mt})});
                if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error?.message||`HTTP ${r.status}`);
                const d=await r.json();
                $('modalBody').textContent = d.choices?.[0]?.message?.content||'无内容';
            }catch(e){$('modalBody').innerHTML=`<span style="color:#c0392b;">错误：${e.message}</span>`;}
        }

        $('btnRandom').onclick=()=>{yao=yao.map(()=>Math.floor(Math.random()*4)); updateDisplay();};
        $('btnClear').onclick=()=>{yao=[1,1,1,1,1,1]; updateDisplay();};
        $('btnFlipMove').onclick=()=>{yao=yao.map(v=>v<2?v+2:v-2); updateDisplay();}; // 动静互换
        $('btnExplain').onclick=showDomainModal;
        $('btnSettings').onclick=()=>{const p=$('settingsPanel');p.style.display=p.style.display==='none'?'block':'none';};
        $('btnSave').onclick=()=>{localStorage.setItem(LS_KEY,JSON.stringify({apiKey:$('apiKey').value,apiBase:$('apiBase').value,apiModel:$('apiModel').value}));showToast('已保存');$('settingsPanel').style.display='none';};
        $('btnTest').onclick=testConnection;
        $('modalClose').onclick=()=>$('modal').classList.remove('active');
        $('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('active');};
        document.onkeydown=e=>{if(e.key==='Escape')$('modal').classList.remove('active');};

        (()=>{
            const s=getSettings();
            $('apiKey').value=s.apiKey;$('apiBase').value=s.apiBase;$('apiModel').value=s.apiModel;
            updateDisplay();
        })();
    </script>
</body>
</html>
